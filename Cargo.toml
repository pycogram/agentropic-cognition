[package]
name = "cognition"
version = "0.1.0"
edition = "2021"
authors = ["rustyai <devrustyai@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "Reasoning, planning, BDI architecture, and decision-making for agents"
repository = "https://github.com/rustyai/cognition"
documentation = "https://docs.rs/cognition"
keywords = ["agents", "bdi", "planning", "reasoning", "ai"]
categories = ["simulation", "algorithms"]
readme = "README.md"

[dependencies]
agent-core = { path = "../agent-core" }

async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
